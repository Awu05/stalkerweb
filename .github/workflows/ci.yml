name: CI

# Runs only when started by hand (Actions tab → CI → Run workflow, on any
# branch) — not on every pull request. Releases are checked by release.yml,
# which runs on a version tag: lint and tests for the backend, the frontend
# and the Android app, before anything is built or published.
on:
  workflow_dispatch:

# Running it again for a branch cancels the run still going for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Lint & Test backend ───────────────────────────────────────────────────
  backend-check:
    runs-on: ubuntu-latest
    # The server also runs inside the all-in-one Android app, on Node 18.
    strategy:
      matrix:
        node-version: ['18', '20']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      # FFmpeg for the tests that run it (casting live TV as HLS), as in the image.
      # Checks only: if it can't be installed, its tests skip (the release requires it).
      - timeout-minutes: 12
        continue-on-error: true
        # Retried: a package mirror that hangs is given up on and tried again.
        run: |
          for i in 1 2 3; do
            timeout 120 sudo apt-get update -qq && timeout 180 sudo apt-get install -y -qq ffmpeg && break
            echo "FFmpeg install attempt $i failed — retrying"; sleep 5
          done
      - run: npm ci
      # The linter itself needs Node 20, so it runs there only.
      - if: matrix.node-version == '20'
        run: npm run lint
      - run: npm test

  # ── Lint & Test frontend ──────────────────────────────────────────────────
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  # ── Build Android debug APKs (mobile + tv) ──────────────────────────────────
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore signing keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Unit tests
        working-directory: android
        run: gradle :app:testMobileRemoteDebugUnitTest :app:testMobileSoloDebugUnitTest

      - name: Build debug APKs (mobile + tv)
        working-directory: android
        run: gradle :app:assembleMobileRemoteDebug :app:assembleTvRemoteDebug

      - name: Upload mobile APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: stalkerweb-mobile-debug
          path: android/app/build/outputs/apk/mobileRemote/debug/app-mobile-remote-debug.apk
          retention-days: 7

      - name: Upload tv APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: stalkerweb-tv-debug
          path: android/app/build/outputs/apk/tvRemote/debug/app-tv-remote-debug.apk
          retention-days: 7

  # ── Docker build check (not published) ────────────────────────────────────
  # Verifies the image still builds, on both platforms, each on a runner of its
  # own kind as release.yml builds them (no QEMU). Images are published only
  # from version tags (release.yml), so the registry lists releases — not one
  # entry per merge, each of which GitHub would label "Latest".
  build-docker:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            scope: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            scope: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}
