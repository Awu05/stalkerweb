name: CI

# Runs only when started by hand (Actions tab → CI → Run workflow, on any
# branch) — not on every pull request. Releases are checked by release.yml,
# which runs on a version tag: lint and tests for the backend, the frontend
# and the Android app, before anything is built or published.
on:
  workflow_dispatch:

# Running it again for a branch cancels the run still going for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Lint & Test backend ───────────────────────────────────────────────────
  backend-check:
    runs-on: ubuntu-latest
    # The server also runs inside the all-in-one Android app, on Node 18.
    strategy:
      matrix:
        node-version: ['18', '20']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      # FFmpeg for the tests that run it (casting live TV as HLS), as in the image.
      # Checks only: if it can't be installed, its tests skip (the release requires it).
      - timeout-minutes: 12
        continue-on-error: true
        # Retried: a package mirror that hangs is given up on and tried again.
        run: |
          for i in 1 2 3; do
            timeout 120 sudo apt-get update -qq && timeout 180 sudo apt-get install -y -qq ffmpeg && break
            echo "FFmpeg install attempt $i failed — retrying"; sleep 5
          done
      - run: npm ci
      # The linter itself needs Node 20, so it runs there only.
      - if: matrix.node-version == '20'
        run: npm run lint
      - run: npm test

  # ── Lint & Test frontend ──────────────────────────────────────────────────
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  # ── Build Android debug APKs (mobile + tv, remote + Solo) ───────────────────
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Restore signing keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore

      # Solo carries Node (nodejs-mobile, checked against a pinned SHA-256) and
      # the server itself; both are build outputs, made here before Gradle.
      - name: Fetch Node for Solo
        run: android/scripts/fetch-libnode.sh

      - name: Pack the server for Solo
        run: android/scripts/pack-solo-server.sh

      - name: Unit tests
        working-directory: android
        run: gradle :app:testMobileRemoteDebugUnitTest :app:testMobileSoloDebugUnitTest

      - name: Build debug APKs (mobile + tv, remote + Solo)
        working-directory: android
        run: gradle :app:assembleMobileRemoteDebug :app:assembleTvRemoteDebug :app:assembleMobileSoloDebug :app:assembleTvSoloDebug

      - name: APK sizes
        working-directory: android/app/build/outputs/apk
        run: ls -l */debug/*.apk

      # The remote apps talk to a server elsewhere: no Node, no server inside.
      - name: Check the remote APKs carry no Node or server
        working-directory: android/app/build/outputs/apk
        run: |
          for apk in mobileRemote/debug/app-mobile-remote-debug.apk tvRemote/debug/app-tv-remote-debug.apk; do
            n=$(unzip -l "$apk" | grep -c -E 'libnode|server\.zip' || true)
            echo "$apk: $n libnode/server.zip entries"
            [ "$n" = 0 ] || { unzip -l "$apk" | grep -E 'libnode|server\.zip'; exit 1; }
          done

      - name: Check the Solo APKs carry Node and the server, under their own app IDs
        working-directory: android/app/build/outputs/apk
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          check() {
            apk="$1"; id="$2"
            for entry in lib/arm64-v8a/libnode.so lib/armeabi-v7a/libnode.so assets/server.zip; do
              unzip -l "$apk" | grep -q " $entry\$" || { echo "$apk: no $entry"; exit 1; }
              echo "$apk: $entry"
            done
            got=$("$aapt2" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            echo "$apk: application id $got"
            [ "$got" = "$id" ] || { echo "expected $id"; exit 1; }
          }
          check mobileSolo/debug/app-mobile-solo-debug.apk com.stalkerweb.android.solo
          check tvSolo/debug/app-tv-solo-debug.apk com.stalkerweb.android.tv.solo

      # The release builds too, as release.yml makes them on a tag — so a tag
      # never finds out first (minified, signed). Signed with the real key when
      # the secret is there, else a throwaway one made here (never committed).
      - name: Signing key for the release builds
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          ks="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$ks"
          else
            echo "no KEYSTORE_B64 secret: a throwaway key"
            keytool -genkeypair -keystore "$ks" -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI throwaway" -noprompt
          fi
          echo "KEYSTORE_PATH=$ks" >> "$GITHUB_ENV"

      - name: Build release APKs (mobile + tv, remote + Solo)
        working-directory: android
        run: gradle :app:assembleMobileRemoteRelease :app:assembleTvRemoteRelease :app:assembleMobileSoloRelease :app:assembleTvSoloRelease -PversionName=0.0.0

      - name: Release APK sizes
        working-directory: android/app/build/outputs/apk
        run: ls -l */release/*.apk

      - name: Check the release APKs — Node and the server in Solo only
        working-directory: android/app/build/outputs/apk
        run: |
          for apk in mobileRemote/release/app-mobile-remote-release.apk tvRemote/release/app-tv-remote-release.apk; do
            n=$(unzip -l "$apk" | grep -c -E 'libnode|server\.zip' || true)
            echo "$apk: $n libnode/server.zip entries"
            [ "$n" = 0 ] || { unzip -l "$apk" | grep -E 'libnode|server\.zip'; exit 1; }
          done
          for apk in mobileSolo/release/app-mobile-solo-release.apk tvSolo/release/app-tv-solo-release.apk; do
            for entry in lib/arm64-v8a/libnode.so lib/armeabi-v7a/libnode.so assets/server.zip; do
              unzip -l "$apk" | grep -q " $entry\$" || { echo "$apk: no $entry"; exit 1; }
              echo "$apk: $entry"
            done
          done

      - name: Upload mobile APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: stalkerweb-mobile-debug
          path: android/app/build/outputs/apk/mobileRemote/debug/app-mobile-remote-debug.apk
          retention-days: 7

      - name: Upload tv APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: stalkerweb-tv-debug
          path: android/app/build/outputs/apk/tvRemote/debug/app-tv-remote-debug.apk
          retention-days: 7

      - name: Upload Solo mobile APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: stalkerweb-solo-mobile-debug
          path: android/app/build/outputs/apk/mobileSolo/debug/app-mobile-solo-debug.apk
          retention-days: 7

      - name: Upload Solo tv APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: stalkerweb-solo-tv-debug
          path: android/app/build/outputs/apk/tvSolo/debug/app-tv-solo-debug.apk
          retention-days: 7

  # ── Docker build check (not published) ────────────────────────────────────
  # Verifies the image still builds, on both platforms, each on a runner of its
  # own kind as release.yml builds them (no QEMU). Images are published only
  # from version tags (release.yml), so the registry lists releases — not one
  # entry per merge, each of which GitHub would label "Latest".
  build-docker:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            scope: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            scope: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}
