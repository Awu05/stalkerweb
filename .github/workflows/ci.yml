name: CI

# Runs only when started by hand (Actions tab → CI → Run workflow, on any
# branch) — not on every pull request. Releases are checked by release.yml,
# which runs on a version tag: lint and tests for the backend, the frontend
# and the Android app, before anything is built or published.
on:
  workflow_dispatch:

# Running it again for a branch cancels the run still going for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Lint & Test backend ───────────────────────────────────────────────────
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      # FFmpeg for the tests that run it (casting live TV as HLS), as in the image.
      # A hung package mirror mustn't hold up the checks: without FFmpeg its tests skip.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
        timeout-minutes: 5
        continue-on-error: true
      - run: npm ci
      - run: npm run lint
      - run: npm test

  # ── Lint & Test frontend ──────────────────────────────────────────────────
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  # ── Build Android debug APKs (mobile + tv) ──────────────────────────────────
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore signing keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Unit tests
        working-directory: android
        run: gradle :app:testMobileDebugUnitTest

      - name: Build debug APKs (mobile + tv)
        working-directory: android
        run: gradle :app:assembleMobileDebug :app:assembleTvDebug

      - name: Upload mobile APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: stalkerweb-mobile-debug
          path: android/app/build/outputs/apk/mobile/debug/app-mobile-debug.apk
          retention-days: 7

      - name: Upload tv APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: stalkerweb-tv-debug
          path: android/app/build/outputs/apk/tv/debug/app-tv-debug.apk
          retention-days: 7

  # ── Docker build check (not published) ────────────────────────────────────
  # Verifies the image still builds. Images are published only from version
  # tags (release.yml), so the registry lists releases — not one entry per
  # merge, each of which GitHub would label "Latest". amd64 only: the arm64
  # leg runs under QEMU and is several times slower; release.yml builds both.
  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
