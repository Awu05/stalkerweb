name: Release

# Push a version tag to publish a release:
#
#   git tag v1.4.0 && git push origin v1.4.0
#
# Runs the backend/frontend checks, then builds and pushes the Docker image
# (linux/amd64 + arm64, each built on its own kind of runner) to
# ghcr.io/<owner>/<repo>, builds signed APKs, and
# creates the GitHub Release. A tag with a pre-release suffix (v1.4.0-rc.1)
# publishes as a pre-release and does not move the `latest` image tag.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

# One release per tag; a re-pushed tag waits for the earlier run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY:   ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ── Extract version from tag ───────────────────────────────────────────────
  version:
    runs-on: ubuntu-latest
    outputs:
      tag:        ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # v1.2.3-rc.1 → pre-release; v1.2.3 → stable
          if [[ "$TAG" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"

  # ── Lint & test before publishing anything ────────────────────────────────
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      # FFmpeg for the backend tests that run it (casting live TV as HLS), as in the image.
      - if: matrix.project == 'backend'
        timeout-minutes: 12
        # Retried: a package mirror that hangs is given up on and tried again.
        run: |
          for i in 1 2 3; do
            timeout 120 sudo apt-get update -qq && timeout 180 sudo apt-get install -y -qq ffmpeg && break
            echo "FFmpeg install attempt $i failed — retrying"; sleep 5
          done
      # A release needs its FFmpeg tests run, not skipped: no FFmpeg, no release.
      - if: matrix.project == 'backend'
        run: command -v ffmpeg && command -v ffprobe
      - run: npm ci
      - run: npm run lint
      - run: npm test

  # ── Build Android APKs (mobile + tv) ────────────────────────────────────────
  build-apk:
    needs: [version, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # No version pin — same setup as ci.yml, whose APK build passes. The
      # old '8.9' pin went stale when AGP moved to 9.x (needs Gradle ≥ 9.4.1).
      - uses: gradle/actions/setup-gradle@v6

      - name: Restore signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > android/debug.keystore

      # The app's unit tests first (ci.yml no longer runs on pull requests).
      - name: Android unit tests
        working-directory: android
        run: gradle :app:testMobileDebugUnitTest

      - name: Build APKs (mobile + tv)
        working-directory: android
        run: |
          VERSION="${{ needs.version.outputs.tag }}"
          VERSION_CLEAN="${VERSION#v}"
          gradle :app:assembleMobileRelease :app:assembleTvRelease -PversionName="$VERSION_CLEAN"

      - name: Upload mobile APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: stalkerweb-mobile-apk
          path: android/app/build/outputs/apk/mobile/release/app-mobile-release.apk
          retention-days: 30

      - name: Upload tv APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: stalkerweb-tv-apk
          path: android/app/build/outputs/apk/tv/release/app-tv-release.apk
          retention-days: 30

  # ── Build & push Docker image ────────────────────────────────────────────
  # Each platform on a machine of its own kind — the arm64 image on GitHub's
  # arm64 runners rather than emulated with QEMU, which was slow and could hang
  # (an emulated `npm ci` crashed and stalled a release for 45 minutes). Each
  # pushes its image by digest; docker-manifest then joins them under the tags.
  build-docker:
    needs: [version, check]
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Downcase IMAGE_NAME, name the platform
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          IMAGE_NAME: ${{ github.repository }}
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ needs.version.outputs.tag }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # The two platform images as one, under the release's tags.
  docker-manifest:
    needs: [version, build-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Downcase IMAGE_NAME
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
        env:
          IMAGE_NAME: ${{ github.repository }}

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.4.2 → :v1.4.2, :1.4.2, :1.4, :1 and :latest.
      # A pre-release (v1.4.2-rc.1) only gets :v1.4.2-rc.1 and :1.4.2-rc.1.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(needs.version.outputs.tag, 'v0.') }}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}

      - name: Create the image under its tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")             $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Check it has both platforms
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} | tee /dev/stderr | grep -q 'linux/arm64'

  # ── Create GitHub Release ────────────────────────────────────────────────
  release:
    needs: [version, build-apk, docker-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Downcase IMAGE_NAME
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
        env:
          IMAGE_NAME: ${{ github.repository }}

      - name: Download mobile APK
        uses: actions/download-artifact@v8
        with:
          name: stalkerweb-mobile-apk

      - name: Download tv APK
        uses: actions/download-artifact@v8
        with:
          name: stalkerweb-tv-apk

      - name: Rename artifacts to include version
        run: |
          mv app-mobile-release.apk stalkerweb-mobile-${{ needs.version.outputs.tag }}.apk
          mv app-tv-release.apk     stalkerweb-tv-${{ needs.version.outputs.tag }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.version.outputs.prerelease == 'false' }}
          files: |
            stalkerweb-mobile-${{ needs.version.outputs.tag }}.apk
            stalkerweb-tv-${{ needs.version.outputs.tag }}.apk
          body: |
            ## Docker image

            ```
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.version.outputs.tag }}
            ```

            ## Android APKs

            | APK | Target |
            |-----|--------|
            | `stalkerweb-mobile-${{ needs.version.outputs.tag }}.apk` | Phone / tablet (Android 8.0+) |
            | `stalkerweb-tv-${{ needs.version.outputs.tag }}.apk` | FireTV / Android TV / Google TV |

            Enable **Install from unknown sources** before sideloading.
